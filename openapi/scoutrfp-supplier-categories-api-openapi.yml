  - supplier_contacts
  - supplier_classifications
  - supplier_company_segmentations
  - supplier_company_risks
  - supplier_company_segmentation_statuses
  - supplier_categories
  - supplier_groups
  - contact_types
  - communication_usage_behaviors
  - phone_device_types
