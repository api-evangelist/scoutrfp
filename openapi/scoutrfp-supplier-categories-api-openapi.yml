            self: https://api.us.workdayspend.com/services/suppliers/v1/supplier_categories/1
    update_response-8:
      value:
        data:
          id: '1'
          type: supplier_categories
          attributes:
            name: Supplier Category Updated
            external_id: SUPCAT-UPD
          links:
            self: https://api.us.workdayspend.com/services/suppliers/v1/supplier_categories/1
    index_response-8:
      value:
        data:
        - id: '1'
          type: supplier_categories
          attributes:
