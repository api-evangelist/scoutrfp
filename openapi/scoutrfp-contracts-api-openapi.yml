          type: string
          description: Term unit for contract termination notice.
          enum:
          - days
          - weeks
          - months
          - years
          example: months
        renewal_termination_notice_value:
          type: integer
          description: Number of term units before the contract actual end date for the termination notice to be sent out.
          example: 5
        renewal_termination_reminder_date:
          type: string
          format: date
          readOnly: true
          description: Date when the termination reminder should be sent based on termination notice date and reminder settings.
