          type: integer
          description: Number of term units between contract renewals.
          example: 4
        renewal_termination_notice_date:
          type: string
          format: date
          readOnly: true
          description: Date when the termination notice should be sent based on actual end date and notice settings.
          example: '2031-07-30'
