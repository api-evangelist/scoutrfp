openapi: 3.2.0
info:
  title: Workday Strategic Sourcing Reports Contract Milestone…
  version: '1.0'
  description: ''
servers:
- url: https://api.us.workdayspend.com
  description: US Region
- url: https://api.ca.workdayspend.com
  description: Canada Region
- url: https://api.eu.workdayspend.com
