security:
- api_key: []
  user_token: []
  user_email: []
tags:
- name: contract_milestone_reports
  x-displayName: Contract Milestone Reports
  description: This report returns a list of contract milestone report entries.
paths:
  /contract_milestone_reports/entries:
    get:
      tags:
      - contract_milestone_reports
      description: Returns a list of milestone report entries.
      operationId: Contract Milestone Report Entries
      summary: Contract Milestone Report Entries
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                type: object
                allOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ContractMilestoneReportEntry'
                - $ref: '#/components/schemas/Pagination'
              examples:
                success:
                  $ref: '#/components/examples/index_response'
        '401':
          description: Unauthorized
      x-codeSamples:
      - label: Curl
        source: "curl -H \"X-Api-Key: ${COMPANY_KEY}\" \\\n     -H \"X-User-Token: ${USER_TOKEN}\" \\\n     -H \"X-User-Email: ${USER_EMAIL}\" \\\n     -H \"Content-Type: application/vnd.api+json\" \\\n     -H \"Accept: application/vnd.api+json,application/vnd.api+json; com.workdayspend.api.version=2019-01-01\"\n     \"https://api.us.workdayspend.com/contract_milestone_reports/entries\"\n"
  /contract_milestone_reports/schema:
    get:
      tags:
      - contract_milestone_reports
      description: Returns the contract milestone report schema.
      operationId: Contract Milestone Report Schema
      summary: Contract Milestone Report Schema
      responses:
        '200':
          description: OK
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContractMilestoneReportEntryFieldModel'
              examples:
                success:
                  $ref: '#/components/examples/schema_response'
        '401':
          description: Unauthorized
      x-codeSamples:
      - label: Curl
        source: "curl -H \"X-Api-Key: ${COMPANY_KEY}\" \\\n     -H \"X-User-Token: ${USER_TOKEN}\" \\\n     -H \"X-User-Email: ${USER_EMAIL}\" \\\n     -H \"Content-Type: application/vnd.api+json\" \\\n     -H \"Accept: application/vnd.api+json,application/vnd.api+json; com.workdayspend.api.version=2019-01-01\"\n     \"https://api.us.workdayspend.com/contract_milestone_reports/schema\"\n"
components:
  schemas:
    ContractMilestoneReportEntryType:
      description: Object type, should always be `contract_milestone_report_entries`.
      example: contract_milestone_report_entries
    ContractMilestoneReportEntryId:
      description: Contract Milestone identifier string.
      example: 1
    ReportSchemaField:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ReportSchemaFieldType'
        name:
          type: string
          description: Field name
          example: Scout-System ID
    ContractMilestoneReportEntryFieldModel:
      type: object
      properties:
        id:
          type: string
          description: Object ID, should always be `contract_milestone_schemas`.
        type:
          type: string
          description: Object type, should always be `contract_milestone_schemas`.
        attributes:
          $ref: '#/components/schemas/ReportSchemaFieldModel'
    ReportSchemaFieldType:
      type: string
      enum:
      - text
      - date
      - integer
      - select
      - string
      description: Field type
      example: string
    ContractMilestoneReportEntryAttributes:
      description: Contract Milestone Report Entry attributes. See example response and schema.
      properties: {}
    PaginationLinks:
      type: object
      description: List of pagination links.
      allOf:
      - $ref: '#/components/schemas/NextPageLink'
      - $ref: '#/components/schemas/PrevPageLink'
    Pagination:
      type: object
      properties:
        links:
          $ref: '#/components/schemas/PaginationLinks'
    ReportSchemaFieldModel:
      type: object
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ReportSchemaField'
    NextPageLink:
      type: object
      properties:
        next:
          type:
          - string
          - 'null'
          format: url
          description: Link to the next results page.
    PrevPageLink:
      type: object
      properties:
        prev:
          type:
          - string
          - 'null'
          format: url
          description: Link to the previous results page.
    ContractMilestoneReportEntry:
      type: object
      required:
      - name
      - id
      properties:
        type:
          $ref: '#/components/schemas/ContractMilestoneReportEntryType'
        id:
          $ref: '#/components/schemas/ContractMilestoneReportEntryId'
        attributes:
          $ref: '#/components/schemas/ContractMilestoneReportEntryAttributes'
