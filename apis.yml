- aid: scoutrfp:scoutrfp-attachments-api
  name: Scout RFP (Workday Strategic Sourcing) attachments API
  description: "Use the attachments API to create, update, and delete the attachments in Workday Strategic Sourcing.\n\
    \n## Working with Attachments\n\nCreating attachments for Workday Strategic Sourcing objects is a two-step process.\
    \ First, you need to inform\nthe system about your intention to upload an attachment by issuing a \"Create an\
    \ Attachment\" request,\nconsisting of the file name and a link to the object to which you are adding an attachment.\
    \ The link\nis represented by a relationship object containing an object ID and its type.\n\nIn the response\
    \ you will receive a link in the `upload_url` attributes, along with required HTTP headers\nto send with your\
    \ file. You will need to upload your file as a binary stream in a PUT request into the\nspecified URL, making\
    \ sure the required headers are present. Here is how the workflow might look\nlike when triggered from a console:\n\
    \n```bash\n$ curl -H \"X-Api-Key: ${COMPANY_KEY}\" \\\n       -H \"X-User-Token: ${USER_TOKEN}\" \\\n      \
    \ -H \"X-User-Email: ${USER_EMAIL}\" \\\n       -H \"Content-Type: application/vnd.api+json\" \\\n       -X\
    \ POST \\\n       -d '\n         {\n           \"data\": {\n             \"type\": \"attachments\",\n      \
    \       \"attributes\": {\n               \"title\": \"My Interesting Document\",\n               \"file_name\"\
    : \"Some Interesting File.pdf\"\n             },\n             \"relationships\": {\n               \"contract\"\
    : {\n                 \"data\": {\n                   \"id\": 1,\n                   \"type\": \"contracts\"\
    \n                 }\n               }\n             }\n           }\n         }\n       ' \\\n       \"https://api.us.workdayspend.com/services/attachments/v1/attachments\"\
    \n\n{\n    \"data\": {\n        \"id\": \"1\",\n        \"type\": \"attachments\",\n        \"attributes\":\
    \ {\n            \"title\": \"My Interesting Document\",\n            \"file_size\": null,\n            \"upload_url\"\
    : \"https://upload.s3.amazonaws.com/uploads/contract/1/hex/file.pdf?some=very&long=url\",\n            \"upload_headers\"\
    : [\n                {\n                    \"name\": \"Content-Type\",\n                    \"value\": \"application/octet-stream\"\
    \n                },\n                {\n                    \"name\": \"x-amz-acl\",\n                    \"\
    value\": \"private\"\n                },\n                {\n                    \"name\": \"x-amz-server-side-encryption\"\
    ,\n                    \"value\": \"AES256\"\n                },\n                {\n                    \"\
    name\": \"Content-Disposition\",\n                    \"value\": \"attachment\"\n                }\n       \
    \     ]\n        }\n    }\n}\n\n$ curl -X PUT \\\n    --data \"@file.pdf\" \\\n    -H \"Content-Type: application/octet-stream\"\
    \ \\\n    -H \"x-amz-acl: private\" \\\n    -H \"x-amz-server-side-encryption: AES256\" \\\n    -H \"Content-Disposition:\
    \ attachment\" \\\n    https://upload.s3.amazonaws.com/uploads/contract/1/hex/file.pdf?some=very&long=url\n\
    ```\n\nThe upload URL expires within 15 minutes after issuing. Please note that you will not be able to upload\n\
    the data file to the attachment object after that. An automated system will purge all partial uploads\nafter\
    \ a certain period (usually within 30-60 minutes after creation) to prevent orphan records from\noverflowing\
    \ the system.\n\n**Please Note**: The list of headers and their values might change at any time, so when you're\n\
    implementing an integration with the Workday Strategic Sourcing system, make sure to include all of the HTTP\
    \ headers\nreturned from the attachments endpoint.\n\n## Attachment Object\n\n<SchemaDefinition schemaRef=\"\
    #/components/schemas/Attachment\" showReadOnly={true} showWriteOnly={true} />"
