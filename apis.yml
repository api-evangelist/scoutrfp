aid: scoutrfp
name: Scout RFP (Workday Strategic Sourcing)
description: >-
  Scout RFP is a strategic sourcing and supplier engagement platform founded in 2014 and acquired by
  Workday in 2019, where it now ships as Workday Strategic Sourcing. The product covers sourcing events
  (RFPs/RFIs/RFQs and auctions), supplier management, contracts, projects, spend categories, awards, and
  supplier payments. Its public developer platform exposes a JSON:API-conformant REST API across eleven
  versioned services — Suppliers, Events, Reports, Contracts, Projects, Payments, Fields, Awards,
  Attachments, and Spend Categories — plus a SCIM 2.0 user-provisioning API. Authentication is by
  company API key plus a per-user personal token, all calls are HTTPS/JSON:API, cursor paginated, and
  rate limited to five requests per second. The legacy v3 API on api.scoutrfp.com was sunset April 18, 2025
  in favor of the versioned services on api.us.workdayspend.com (with EU and CA regional hosts).
